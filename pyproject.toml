[build-system]
# nanobind 3.0 dropped Python 3.9 (its wheel still installs there, then
# refuses to import), so 3.9 must stay on the 2.x line.
requires = [
    "scikit-build-core>=0.10",
    "nanobind>=2.0,<3; python_version < '3.10'",
    "nanobind>=2.0;    python_version >= '3.10'",
]
build-backend = "scikit_build_core.build"


[project]
name            = "pyvai"
dynamic         = ["version"]                       # single-sourced from python/pyvai/__init__.py
description     = "Python bindings for the vAi engine"
readme          = "python/README.md"
license         = { text = "MIT" }                  # same as the repo-root LICENSE
authors         = [{ name = "vAi-Strata" }]
keywords        = ["vulkan", "inference", "neural-network", "gpu", "nanobind"]
requires-python = ">=3.9,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20",
    "Pillow",       # the examples' image I/O — pyvai itself never imports it
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://vaistrata.com"
Issues   = "https://github.com/vaistrata/vAi/issues"


[tool.scikit-build]
minimum-version    = "0.10"
cmake.version      = ">=3.16"
cmake.build-type   = "Release"
build-dir          = "build/{wheel_tag}"
wheel.packages     = ["python/pyvai"]
install.components = ["python"]

[tool.scikit-build.cmake.define]
VAI_BUILD_PYTHON   = "ON"
VAI_BUILD_EXAMPLES = "OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input    = "python/pyvai/__init__.py"
regex    = '''__version__\s*(?::\s*str)?\s*=\s*["'](?P<value>[^"']+)["']'''

[tool.pytest.ini_options]
# Tests import the editable install — run `pip install -e .` first.
testpaths = ["python/tests"]
